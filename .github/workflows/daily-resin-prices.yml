name: Daily resin prices
on:
  schedule:
    - cron: '30 23 * * *'   # 06:30 sáng giờ Việt Nam (UTC+7)
  workflow_dispatch:         # bấm chạy tay trong tab Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-resin-prices.mjs
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "chore: update resin prices $(date -u +%F)" && git push)
